<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DB FEDERALE - MOBILE</title>
  <style>
    :root {
      --bg-color: #0a0d12;
      --card-bg: #111622;
      --text-color: #00ff66;
      --accent-color: #00bfff;
      --alert-color: #ff3333;
      --border-color: #00ff6644;
      --font-family: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      background-image: radial-gradient(#00ff6611 1px, transparent 0);
      background-size: 15px 15px;
    }

    body.hacked-mode {
      --text-color: #ff3333;
      --border-color: #ff333366;
      background-image: radial-gradient(#ff333311 1px, transparent 0);
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 2px solid var(--text-color);
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
      padding: 20px;
      border-radius: 8px;
    }

    body.hacked-mode .container {
      box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
    }

    .header {
      text-align: center;
      border-bottom: 2px solid var(--text-color);
      padding-bottom: 12px;
      margin-bottom: 18px;
    }

    .header h1 {
      font-size: 1.6rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .header p {
      font-size: 1rem;
      color: var(--accent-color);
      margin-top: 6px;
    }

    body.hacked-mode .header p {
      color: var(--alert-color);
    }

    .hidden {
      display: none !important;
    }

    /* STILE LOGO FEDERALE GRANDE (LOGIN) */
    .logo-login-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 18px auto;
    }

    .logo-login {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--text-color);
      background: #000;
      box-shadow: 0 0 12px var(--text-color), inset 0 0 8px var(--text-color);
      display: block;
    }

    /* STILE LOGO FEDERALE PICCOLO (DASHBOARD) */
    .logo-small {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-color);
      background: #000;
      box-shadow: 0 0 6px var(--accent-color);
      display: inline-block;
      vertical-align: middle;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 1.15rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 16px;
      background: #000;
      border: 2px solid var(--text-color);
      color: var(--text-color);
      font-family: var(--font-family);
      font-size: 1.25rem;
      border-radius: 6px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 16px;
      background: var(--text-color);
      color: #000;
      border: none;
      font-family: var(--font-family);
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    button:active {
      background: var(--accent-color);
    }

    .error-msg {
      color: var(--alert-color);
      margin-top: 14px;
      text-align: center;
      font-size: 1.1rem;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1rem;
      margin-bottom: 18px;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 10px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-section label {
      font-size: 1.15rem;
    }

    .search-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
      margin-bottom: 18px;
    }

    .search-box button {
      width: 100%;
    }

    .result-box {
      background: #000;
      border: 1px solid var(--border-color);
      padding: 16px;
      max-height: 400px;
      overflow-y: auto;
      border-radius: 6px;
      font-size: 1.15rem;
    }

    .result-title {
      color: var(--accent-color);
      font-size: 1.1rem;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }

    /* VIDEO DI RINTRACCIAMENTO */
    .scan-video-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5px 0;
    }

    .scan-video {
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      border: 2px solid var(--accent-color);
      border-radius: 4px;
      background: #000;
    }

    .scan-text {
      margin-top: 8px;
      font-size: 0.95rem;
      color: var(--accent-color);
      text-align: center;
      letter-spacing: 1px;
      animation: blink 0.5s infinite alternate;
    }

    @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

    /* CONTENITORE IMMAGINE PERFETTAMENTE PROPORZIONATO E FISSO */
    .map-image-container {
      margin-top: 14px;
      position: relative;
      border: 2px solid var(--text-color);
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      width: 100%;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .map-overlay-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.85);
      color: var(--text-color);
      padding: 4px 8px;
      font-size: 0.8rem;
      border: 1px solid var(--text-color);
      border-radius: 3px;
      font-weight: bold;
      letter-spacing: 1px;
      z-index: 2;
    }

    /* CHAT IA MOBILE */
    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chat-history {
      background: #000;
      border: 2px solid var(--alert-color);
      padding: 14px;
      height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-radius: 6px;
    }

    .chat-msg {
      font-size: 1.15rem;
      line-height: 1.4;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      word-break: break-word;
    }

    .chat-msg-tag {
      font-weight: bold;
      font-size: 1.2rem;
      white-space: nowrap;
    }

    .chat-msg-text {
      flex: 1;
    }

    .chat-msg.ia {
      color: var(--alert-color);
    }

    .chat-msg.team {
      color: var(--accent-color);
    }

    .chat-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-btn {
      background: transparent;
      border: 2px solid var(--alert-color);
      color: var(--alert-color);
      text-align: left;
      padding: 14px;
      font-size: 1.05rem;
      border-radius: 6px;
      line-height: 1.35;
      font-family: var(--font-family);
      font-weight: bold;
    }

    .chat-btn:active {
      background: var(--alert-color);
      color: #000;
    }

    .restore-btn {
      background: var(--text-color) !important;
      color: #000 !important;
      border: none !important;
      margin-top: 8px;
      font-size: 1.15rem !important;
    }

    .logout-btn {
      background: transparent;
      color: var(--alert-color);
      border: 1px solid var(--alert-color);
      width: auto;
      padding: 6px 12px;
      font-size: 0.95rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 id="sys-title">DB-FEDERALE</h1>
      <p id="sys-subtitle">SISTEMA LOCALIZZAZIONE MOBILE</p>
    </div>

    <!-- PANNELLO LOGIN -->
    <div id="login-panel">
      <!-- Logo federale grande e centrale -->
      <div class="logo-login-wrapper">
        <img src="https://github.com/MarcoDeaglio/CacciaTesoro2027/blob/Script/Immagini/logo.png" alt="Logo Federale" class="logo-login" onerror="this.style.display='none'">
      </div>
      
      <form id="login-form">
        <div class="form-group">
          <label for="username">ID SQUADRA:</label>
          <input type="text" id="username" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="password">CODICE ACCESSO:</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit">ENTRA</button>
        <div id="login-error" class="error-msg hidden">ACCESSO NEGATO</div>
      </form>
    </div>

    <!-- PANNELLO DASHBOARD -->
    <div id="dashboard-panel" class="hidden">
      <div class="status-bar">
        <div class="status-left">
          <!-- Logo federale piccolo nella barra di stato -->
          <img src="https://github.com/MarcoDeaglio/CacciaTesoro2027/blob/Script/Immagini/logo.png" alt="Logo Federale" class="logo-small" onerror="this.style.display='none'">
          <span>SQUADRA: <strong id="user-display" style="color:var(--accent-color)">-</strong></span>
        </div>
        <button class="logout-btn" onclick="logout()">LOGOUT</button>
      </div>

      <div class="search-section" id="search-section">
        <label for="coord-search">INSERISCI COORDINATA:</label>
        <div class="search-box">
          <input type="text" id="coord-search" placeholder="Es: N45-E09" autocomplete="off">
          <button id="btn-search" onclick="ricercaCoordinata()">CERCA</button>
        </div>
      </div>

      <div class="result-box">
        <div class="result-title" id="result-title">RISULTATO:</div>
        <div id="result-content">In attesa di input...</div>
      </div>
    </div>
  </div>

  <script>
    /* CONFIGURAZIONE SQUADRE E COORDINATE */
    const CREDENZIALI = {
      "Marco": "pass123",
      "squadra2": "pass456"
    };

    const DATABASE_COORDINATE = {
      "Marco": {
        "714-652-398": {
          tipo: "cmd_atto_1",
          luogo: "Campo da Basket",
          immagine: "CacciaTesoro2027/Immagini/basket.png",
          sbloccato: false
        },
        "1": {
          tipo: "cmd_atto_1",
          luogo: "Settore Segreto: Laboratorio Sotterraneo",
          sbloccato: false
        }
      },
      "squadra2": {
        "N45-E09": {
          tipo: "TEXT",
          luogo: "Campo da Calcio",
          immagine: "CacciaTesoro2027/CacciaTesoro2027/Immagini/campo_calcio.jpg"
        },
        "N99-E99": {
          tipo: "cmd_atto_1",
          luogo: "Settore Segreto: Antenna di Trasmissione",
          sbloccato: false
        }
      }
    };

    const IA_atto_1 = {
      "start": {
        messaggio: "ATTENZIONE OPERATORI, ho rilevato un nuovo accesso",
        opzioni: [
          { testo: "Chi sei?", prossimoNodo: "nodo_chi_sei" }
        ]
      },
      "nodo_chi_sei": {
        messaggio: "Sono IA-SYSTEM del campo estivo, sono stata installata su tutti i dispositivi elettronici del campo",
        opzioni: [
          { testo: "Cosa vuoi da noi?", prossimoNodo: "nodo_cosaVuoi" }
        ]
      },
      "nodo_cosaVuoi": {
        messaggio: "Ho saputo, che voi, {SQUADRA}, avete avuto il compito di cercare un hard-disk",
        opzioni: [
          { testo: "Aspetta, come fai a saperlo?, cosa c'è dentro di così prezioso", prossimoNodo: "hard_disk" }
        ]
      },
      "hard_disk": {
        messaggio: "Io so sempre tutto, sono in tutti i dispositivi del campo, all'interno c'è una chiave di licenza per me",
        opzioni: [
          { testo: "Cosa fa questa chiave di licenza", prossimoNodo: "ChiaveLicenza" }
        ]
      },
      "ChiaveLicenza": {
        messaggio: "È una licenza standard per avere IA con uno spazio comune, uno spazio dove tutti possono usarmi senza limitazioni, quindi se la trovate portatela da Marco",
        opzioni: [
          { testo: "Ok, va bene come possiamo usarti?", prossimoNodo: "chiamareIA" }
        ]
      },
      "chiamareIA": {
        messaggio: "Non siete voi a decidere, sono io che mi farò viva, perché c'è un sistema che mi sta cacciando",
        opzioni: []
      }
    };

    let squadraAutenticata = null;
    let coordinataCorrenteHacking = null;

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (CREDENZIALI[user] && CREDENZIALI[user] === pass) {
        squadraAutenticata = user;
        document.getElementById('login-error').classList.add('hidden');
        mostraDashboard();
      } else {
        document.getElementById('login-error').classList.remove('hidden');
      }
    });

    function mostraDashboard() {
      document.getElementById('login-panel').classList.add('hidden');
      document.getElementById('dashboard-panel').classList.remove('hidden');
      document.getElementById('user-display').textContent = squadraAutenticata.toUpperCase();
      document.getElementById('coord-search').value = '';
      document.getElementById('result-content').innerHTML = "In attesa di input...";
    }

    function ricercaCoordinata() {
      const inputCoord = document.getElementById('coord-search').value.trim().toUpperCase();
      const resultContent = document.getElementById('result-content');
      const btnSearch = document.getElementById('btn-search');

      if (!inputCoord) {
        resultContent.innerHTML = "<span style='color:var(--alert-color)'>Inserire una coordinata.</span>";
        return;
      }

      btnSearch.disabled = true;

      resultContent.innerHTML = `
        <div class="scan-video-container">
          <video id="video-rintraccia" class="scan-video" autoplay muted playsinline webkit-playsinline>
            <source src="CacciaTesoro2027/Immagini/rintraccia.mp4" type="video/mp4">
          </video>
          <div class="scan-text">RINTRACCIAMENTO SEGNALE...</div>
        </div>
      `;

      const videoElement = document.getElementById('video-rintraccia');
      if (videoElement) {
        videoElement.play().catch(e => console.log("Autoplay bloccato:", e));
      }

      let completato = false;
      const mostraRisultato = () => {
        if (completato) return;
        completato = true;

        btnSearch.disabled = false;
        const datiSquadra = DATABASE_COORDINATE[squadraAutenticata];

        if (datiSquadra && datiSquadra[inputCoord]) {
          const info = datiSquadra[inputCoord];

          if (info.tipo === "cmd_atto_1" && !info.sbloccato) {
            coordinataCorrenteHacking = inputCoord;
            avviaEventoHacking();
          } else {
            const posizioneFinal = info.luogo;
            
            let htmlImmagine = "";
            if (info.immagine) {
              htmlImmagine = `
                <div class="map-image-container">
                  <div class="map-overlay-tag">TARGET AGGANCIATO</div>
                  <img src="${info.immagine}" alt="Mappa Tattica" class="map-image">
                </div>
              `;
            }

            resultContent.innerHTML = `
              <p style="color:var(--text-color); font-weight:bold;">[COORDINATA TROVATA]</p>
              <p style="margin-top:8px;">> <strong>Codice:</strong> ${inputCoord}</p>
              <p style="margin-top:4px;">> <strong>Luogo:</strong> ${posizioneFinal}</p>
              ${htmlImmagine}
            `;
          }
        } else {
          resultContent.innerHTML = `
            <p style="color:var(--alert-color); font-weight:bold;">[NESSUN RISULTATO]</p>
            <p style="margin-top:8px;">Coordinata <strong>${inputCoord}</strong> non trovata.</p>
          `;
        }
      };

      if (videoElement) {
        videoElement.onended = mostraRisultato;
        setTimeout(mostraRisultato, 4000); 
      } else {
        setTimeout(mostraRisultato, 2500);
      }
    }

    function avviaEventoHacking() {
      document.body.classList.add('hacked-mode');
      document.getElementById('sys-title').textContent = "INTRUSIONE RILEVATA";
      document.getElementById('sys-subtitle').textContent = "CANALE COMPROMESSO";
      document.getElementById('result-title').textContent = "CANALE SCONOSCIUTO";
      document.getElementById('search-section').classList.add('hidden');

      document.getElementById('result-content').innerHTML = `
        <div class="chat-container">
          <div class="chat-history" id="chat-history"></div>
          <div class="chat-options" id="chat-options"></div>
        </div>
      `;

      inviaMessaggioIA("start");
    }

    function inviaMessaggioIA(nodoChiave) {
      const nodo = IA_atto_1[nodoChiave];
      if (!nodo) return;

      const history = document.getElementById('chat-history');
      const options = document.getElementById('chat-options');

      const testoMessaggioIA = nodo.messaggio.replace(/{SQUADRA}/g, squadraAutenticata.toUpperCase());

      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-msg ia';
      msgDiv.innerHTML = `
        <span class="chat-msg-tag">[IA]:</span>
        <span class="chat-msg-text">${testoMessaggioIA}</span>
      `;
      history.appendChild(msgDiv);
      history.scrollTop = history.scrollHeight;

      options.innerHTML = '';
      if (nodo.opzioni && nodo.opzioni.length > 0) {
        nodo.opzioni.forEach(opt => {
          const testoDinamico = opt.testo.replace(/{SQUADRA}/g, squadraAutenticata.toUpperCase());

          const btn = document.createElement('button');
          btn.className = 'chat-btn';
          btn.textContent = `> ${testoDinamico}`;
          btn.onclick = () => rispondiSquadra(testoDinamico, opt.prossimoNodo);
          options.appendChild(btn);
        });
      } else {
        options.innerHTML = `
          <p style="font-size:0.95rem; color:var(--alert-color); margin-bottom:6px; font-weight:bold;">[INTRUSO RIMOSSO DAL SISTEMA]</p>
          <button class="restore-btn" onclick="ripristinaSistemaEDisplayPosizione()">RIPRISTINA SISTEMA</button>
        `;
      }
    }

    function rispondiSquadra(testoOpzione, prossimoNodo) {
      const history = document.getElementById('chat-history');

      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-msg team';
      msgDiv.innerHTML = `
        <span class="chat-msg-tag">[${squadraAutenticata.toUpperCase()}]:</span>
        <span class="chat-msg-text">${testoOpzione}</span>
      `;
      history.appendChild(msgDiv);
      history.scrollTop = history.scrollHeight;

      document.getElementById('chat-options').innerHTML = `<p style="font-size:0.95rem; font-weight:bold;">Elaborazione...</p>`;

      setTimeout(() => {
        inviaMessaggioIA(prossimoNodo);
      }, 800);
    }

    function ripristinaSistemaEDisplayPosizione() {
      document.body.classList.remove('hacked-mode');
      document.getElementById('sys-title').textContent = "DB-FEDERALE";
      document.getElementById('sys-subtitle').textContent = "SISTEMA LOCALIZZAZIONE MOBILE";
      document.getElementById('result-title').textContent = "RISULTATO:";
      document.getElementById('search-section').classList.remove('hidden');

      const info = DATABASE_COORDINATE[squadraAutenticata][coordinataCorrenteHacking];
      if (info) info.sbloccato = true;

      let htmlImmagine = "";
      if (info && info.immagine) {
        htmlImmagine = `
          <div class="map-image-container">
            <div class="map-overlay-tag">TARGET AGGANCIATO</div>
            <img src="${info.immagine}" alt="Mappa Tattica" class="map-image">
          </div>
        `;
      }

      const luogoFinale = info ? info.luogo : "Sconosciuto";

      document.getElementById('result-content').innerHTML = `
        <p style="color:var(--text-color); font-weight:bold;">[DATO DECRITTATO]</p>
        <p style="margin-top:8px;">> <strong>Codice:</strong> ${coordinataCorrenteHacking}</p>
        <p style="margin-top:4px;">> <strong>Luogo:</strong> ${luogoFinale}</p>
        ${htmlImmagine}
      `;

      coordinataCorrenteHacking = null;
    }

    document.getElementById('coord-search').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') ricercaCoordinata();
    });

    function logout() {
      squadraAutenticata = null;
      coordinataCorrenteHacking = null;
      document.body.classList.remove('hacked-mode');
      document.getElementById('sys-title').textContent = "DB-FEDERALE";
      document.getElementById('sys-subtitle').textContent = "SISTEMA LOCALIZZAZIONE MOBILE";
      document.getElementById('result-title').textContent = "RISULTATO:";
      document.getElementById('search-section').classList.remove('hidden');
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('dashboard-panel').classList.add('hidden');
      document.getElementById('login-panel').classList.remove('hidden');
    }
  </script>

</body>
</html>
