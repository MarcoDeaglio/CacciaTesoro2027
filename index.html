<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DB FEDERALE - MOBILE</title>
  <style>
    :root {
      --bg-color: #0a0d12;
      --card-bg: #111622;
      --text-color: #00ff66;
      --accent-color: #00bfff;
      --alert-color: #ff3333;
      --border-color: #00ff6644;
      --font-family: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      background-image: radial-gradient(#00ff6611 1px, transparent 0);
      background-size: 15px 15px;
    }

    body.hacked-mode {
      --text-color: #ff3333;
      --border-color: #ff333366;
      background-image: radial-gradient(#ff333311 1px, transparent 0);
    }

    /* TEMA SPECIALE JURASSIC PARK */
    body.dino-mode {
      --bg-color: #0b140c;
      --card-bg: #111e13;
      --text-color: #ffd700;
      --accent-color: #ff8c00;
      --border-color: #ffd70044;
      background-image: radial-gradient(#ffd70011 1px, transparent 0);
    }

    body.dino-mode .container {
      border-color: var(--text-color);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 2px solid var(--text-color);
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
      padding: 20px;
      border-radius: 8px;
    }

    .header {
      text-align: center;
      border-bottom: 2px solid var(--text-color);
      padding-bottom: 12px;
      margin-bottom: 18px;
    }

    .header h1 {
      font-size: 1.6rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .header p {
      font-size: 1rem;
      color: var(--accent-color);
      margin-top: 6px;
    }

    .hidden {
      display: none !important;
    }

    /* STILE LOGO FEDERALE GRANDE (LOGIN) */
    .logo-login-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 18px auto;
    }

    .logo-login {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--text-color);
      background: #000;
      box-shadow: 0 0 12px var(--text-color), inset 0 0 8px var(--text-color);
      display: block;
    }

    /* STILE LOGO FEDERALE PICCOLO (DASHBOARD) */
    .logo-small {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-color);
      background: #000;
      box-shadow: 0 0 6px var(--accent-color);
      display: inline-block;
      vertical-align: middle;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 1.15rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 16px;
      background: #000;
      border: 2px solid var(--text-color);
      color: var(--text-color);
      font-family: var(--font-family);
      font-size: 1.25rem;
      border-radius: 6px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 16px;
      background: var(--text-color);
      color: #000;
      border: none;
      font-family: var(--font-family);
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    button:active {
      background: var(--accent-color);
    }

    .error-msg {
      color: var(--alert-color);
      margin-top: 14px;
      text-align: center;
      font-size: 1.1rem;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.05rem;
      margin-bottom: 18px;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 10px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* PULSANTE AIUTO IN ALTO A SINISTRA */
    .help-btn {
      background: transparent;
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 5px 8px;
      font-size: 0.85rem;
      border-radius: 4px;
      font-family: var(--font-family);
      font-weight: bold;
      cursor: pointer;
    }

    .help-btn:active {
      background: var(--accent-color);
      color: #000;
    }

    .search-section label {
      font-size: 1.15rem;
    }

    .search-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
      margin-bottom: 18px;
    }

    .result-box {
      background: #000;
      border: 1px solid var(--border-color);
      padding: 16px;
      max-height: 420px;
      overflow-y: auto;
      border-radius: 6px;
      font-size: 1.15rem;
    }

    .result-title {
      color: var(--accent-color);
      font-size: 1.1rem;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }

    /* STILI CRUCIVERBA */
    .crossword-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 2px;
      background: var(--border-color);
      border: 2px solid var(--text-color);
      margin: 12px 0;
      padding: 2px;
    }

    .cw-cell {
      background: #000;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: var(--text-color);
      font-weight: bold;
    }

    .cw-cell.blocked {
      background: repeating-linear-gradient(
        45deg,
        #111,
        #111 4px,
        #333 4px,
        #333 8px
      );
    }

    .clue-section {
      margin-top: 10px;
      font-size: 0.85rem;
    }

    .clue-title {
      color: var(--accent-color);
      font-weight: bold;
      margin-bottom: 4px;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 2px;
    }

    .clue-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
    }

    .clue-box {
      border: 1px solid var(--text-color);
      padding: 2px 5px;
      font-size: 0.8rem;
      background: rgba(0, 255, 102, 0.05);
    }

    /* VIDEO DI RINTRACCIAMENTO */
    .scan-video-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5px 0;
    }

    .scan-video {
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      border: 2px solid var(--accent-color);
      border-radius: 4px;
      background: #000;
    }

    .scan-text {
      margin-top: 8px;
      font-size: 0.95rem;
      color: var(--accent-color);
      text-align: center;
      letter-spacing: 1px;
      animation: blink 0.5s infinite alternate;
    }

    @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

    /* CONTENITORE IMMAGINE LABIRINTO/MAPPA (STILE APP) */
    .map-image-container {
      margin-top: 14px;
      position: relative;
      border: 2px solid var(--text-color);
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      width: 100%;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
    }

    .map-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .map-overlay-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.85);
      color: var(--text-color);
      padding: 4px 8px;
      font-size: 0.8rem;
      border: 1px solid var(--text-color);
      border-radius: 3px;
      font-weight: bold;
      letter-spacing: 1px;
      z-index: 2;
    }

    .enigmi-grid-scroll {
      max-height: 340px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding-right: 4px;
    }

    .enigma-btn {
      background: rgba(0, 191, 255, 0.1);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 12px 0;
      font-size: 1rem;
      font-family: var(--font-family);
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .enigma-btn:active {
      background: var(--accent-color);
      color: #000;
    }

    .dino-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .dino-btn {
      background: rgba(255, 215, 0, 0.1);
      border: 2px solid var(--text-color);
      color: var(--text-color);
      text-align: left;
      padding: 12px;
      font-size: 1.05rem;
      font-family: var(--font-family);
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .dino-btn:active {
      background: var(--text-color);
      color: #000;
    }

    .back-dino-btn {
      background: var(--alert-color) !important;
      color: #fff !important;
      border: none !important;
      margin-top: 12px;
    }

    /* STILI CALCOLATRICE DINOSAURI CON AUTO-ADATTAMENTO IMMAGINI */
    .dino-calc-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dino-screen-label {
      font-size: 0.8rem;
      color: var(--accent-color);
      margin-bottom: -4px;
    }

    .dino-screen {
      width: 100%;
      padding: 10px;
      background: #000;
      border: 1px solid var(--text-color);
      color: var(--text-color);
      font-family: var(--font-family);
      font-size: 1.1rem;
      border-radius: 4px;
      min-height: 58px;
      word-break: break-all;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Miniatura auto-adattata nell'input */
    .dino-screen img.calc-mini-img {
      width: 36px;
      height: 36px;
      max-width: 100%;
      object-fit: contain;
      border-radius: 3px;
      border: 1px solid var(--text-color);
      background: #000;
      vertical-align: middle;
    }

    .dino-output-screen {
      width: 100%;
      padding: 12px;
      background: #000;
      border: 2px solid var(--accent-color);
      color: var(--accent-color);
      font-family: var(--font-family);
      font-size: 1.1rem;
      border-radius: 6px;
      min-height: 48px;
      display: flex;
      align-items: center;
      font-weight: bold;
    }

    .dino-calc-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .dino-calc-btn {
      background: rgba(255, 215, 0, 0.08);
      border: 1px solid var(--text-color);
      color: var(--text-color);
      padding: 6px;
      font-size: 0.7rem;
      font-family: var(--font-family);
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    /* Immagine auto-adattata sul pulsante */
    .dino-calc-btn img.calc-btn-img {
      width: 42px;
      height: 42px;
      max-width: 100%;
      object-fit: contain;
      border-radius: 4px;
      border: 1px solid var(--text-color);
      background: #000;
    }

    .dino-calc-btn:active {
      background: var(--text-color);
      color: #000;
    }

    .dino-operators-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .dino-op-btn {
      background: rgba(0, 191, 255, 0.1);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 10px;
      font-size: 1.1rem;
      font-family: var(--font-family);
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .dino-op-btn:active {
      background: var(--accent-color);
      color: #000;
    }

    .dino-calc-actions {
      display: flex;
      gap: 6px;
    }

    .dino-calc-actions button {
      flex: 1;
      padding: 10px;
      font-size: 0.85rem;
    }

    /* CHAT IA MOBILE */
    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 10px;
    }

    .chat-history {
      background: #000;
      border: 2px solid var(--alert-color);
      padding: 12px;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-radius: 6px;
    }

    .chat-msg {
      font-size: 1.1rem;
      line-height: 1.4;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      word-break: break-word;
    }

    .chat-msg-tag {
      font-weight: bold;
      font-size: 1.15rem;
      white-space: nowrap;
    }

    .chat-msg-text {
      flex: 1;
    }

    .chat-msg.ia {
      color: var(--alert-color);
    }

    .chat-msg.team {
      color: var(--accent-color);
    }

    .chat-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-btn {
      background: transparent;
      border: 2px solid var(--alert-color);
      color: var(--alert-color);
      text-align: left;
      padding: 12px;
      font-size: 1rem;
      border-radius: 6px;
      line-height: 1.35;
      font-family: var(--font-family);
      font-weight: bold;
    }

    .chat-btn:active {
      background: var(--alert-color);
      color: #000;
    }

    .restore-btn {
      background: var(--text-color) !important;
      color: #000 !important;
      border: none !important;
      margin-top: 4px;
      font-size: 1.1rem !important;
    }

    .logout-btn {
      background: transparent;
      color: var(--alert-color);
      border: 1px solid var(--alert-color);
      width: auto;
      padding: 5px 10px;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 id="sys-title">DB-FEDERALE</h1>
      <p id="sys-subtitle">SISTEMA LOCALIZZAZIONE MOBILE</p>
    </div>

    <!-- PANNELLO LOGIN -->
    <div id="login-panel">
      <div class="logo-login-wrapper">
        <img src="Immagini/logo.png" alt="Logo Federale" class="logo-login" onerror="this.style.display='none'">
      </div>
      
      <form id="login-form">
        <div class="form-group">
          <label for="username">ID SQUADRA:</label>
          <input type="text" id="username" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="password">CODICE ACCESSO:</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit">ENTRA</button>
        <div id="login-error" class="error-msg hidden">ACCESSO NEGATO</div>
      </form>
    </div>

    <!-- PANNELLO DASHBOARD -->
    <div id="dashboard-panel" class="hidden">
      <div class="status-bar">
        <div class="status-left">

          <img src="Immagini/logo.png" alt="Logo Federale" class="logo-small" onerror="this.style.display='none'">
        </div>
        <div class="status-right">
          <span style="font-size: 0.95rem;"><strong id="user-display" style="color:var(--accent-color)">-</strong></span>
          <button class="logout-btn" onclick="logout()">LOGOUT</button>
        </div>
      </div>

      <div class="search-section" id="search-section">
        <label for="coord-search">INSERISCI COORDINATA:</label>
        <div class="search-box">
          <input type="text" id="coord-search" placeholder="Es: 714-652-398" maxlength="11" autocomplete="off">
          <button id="btn-search" onclick="ricercaCoordinata()">CERCA</button>
        </div>
      </div>

      <div class="result-box" id="main-result-box">
        <div class="result-title" id="result-title">RISULTATO:</div>
        <div id="result-content">In attesa di input...</div>
      </div>
    </div>

    <!-- NUOVA HOME SEZIONE AIUTO / 27 ENIGMI -->

      <div class="status-bar">
        <span style="color: var(--accent-color); font-weight: bold;">ARCHIVIO ENIGMI (27)</span>
        <button class="logout-btn" onclick="chiudiAiutoHome()">TORNA AL DB</button>
      </div>

      <div class="result-box">
        <div class="result-title">SELEZIONA ENIGMA:</div>
        <div id="help-content">
          <!-- Generato via JavaScript -->
        </div>
      </div>
    </div>

  </div>

    function ricercaCoordinata() {
      const inputCoord = document.getElementById('coord-search').value.trim().toUpperCase();
      const resultContent = document.getElementById('result-content');
      const btnSearch = document.getElementById('btn-search');

      if (!inputCoord) {
        resultContent.innerHTML = "<span style='color:var(--alert-color)'>Inserire una coordinata.</span>";
        return;
      }

      btnSearch.disabled = true;

      resultContent.innerHTML = `
        <div class="scan-video-container">
          <video id="video-rintraccia" class="scan-video" autoplay muted playsinline webkit-playsinline>
            <source src="Immagini/rintraccia.mp4" type="video/mp4">
          </video>
          <div class="scan-text">RINTRACCIAMENTO SEGNALE...</div>
        </div>
      `;

      const videoElement = document.getElementById('video-rintraccia');
      if (videoElement) {
        videoElement.play().catch(e => console.log("Autoplay bloccato:", e));
      }

      let completato = false;
      const mostraRisultato = () => {
        if (completato) return;
        completato = true;

        btnSearch.disabled = false;
        const datiSquadra = DATABASE_COORDINATE[squadraAutenticata];

        if (datiSquadra && datiSquadra[inputCoord]) {
          const info = datiSquadra[inputCoord];

          if (info.tipo === "cmd_atto_1" && !info.sbloccato) {
            coordinataCorrenteHacking = inputCoord;
            avviaEventoHacking();
          } else if (info.tipo === "cmd_dino") {
            avviaEventoDino();
          } else {
            const posizioneFinal = info.luogo;
            
            let htmlImmagine = "";
            if (info.immagine) {
              htmlImmagine = `
                <div class="map-image-container">
                  <div class="map-overlay-tag">TARGET AGGANCIATO</div>
                  <img src="${info.immagine}" alt="Mappa Tattica" class="map-image">
                </div>
              `;
            }

            resultContent.innerHTML = `
              <p style="color:var(--text-color); font-weight:bold;">[COORDINATA TROVATA]</p>
              <p style="margin-top:8px;">> <strong>Codice:</strong> ${inputCoord}</p>
              <p style="margin-top:4px;">> <strong>Luogo:</strong> ${posizioneFinal}</p>
              ${htmlImmagine}
            `;
          }
        } else {
          resultContent.innerHTML = `
            <p style="color:var(--alert-color); font-weight:bold;">[NESSUN RISULTATO]</p>
            <p style="margin-top:8px;">Coordinata <strong>${inputCoord}</strong> non trovata.</p>
          `;
        }
      };

      if (videoElement) {
        videoElement.onended = mostraRisultato;
        setTimeout(mostraRisultato, 4000); 
      } else {
        setTimeout(mostraRisultato, 2500);
      }
    }

      const screen = document.getElementById('dino-input-screen');
      let rawVal = screen.getAttribute('data-raw') || "";

      const itemHtml = `<img src="${percorsoImmagine}" alt="${nomeDino}" class="calc-mini-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'36\' height=\'36\'><rect width=\'100%\' height=\'100%\' fill=\'%23000\'/><text x=\'50%\' y=\'50%\' fill=\'%23ffd700\' font-size=\'10\' text-anchor=\'middle\' dominant-baseline=\'middle\'>${valore}</text></svg>'">`;

      if (screen.textContent === "Inserisci sequenza...") {
        screen.innerHTML = itemHtml;
        screen.setAttribute('data-raw', valore);
      } else {
        screen.innerHTML += " " + itemHtml;
        screen.setAttribute('data-raw', rawVal + valore);
      }
    }

    function aggiungiOperatoreInput(op) {
      const screen = document.getElementById('dino-input-screen');
      let rawVal = screen.getAttribute('data-raw') || "";

      const opHtml = `<span style="font-size: 1.3rem; font-weight: bold; color: var(--accent-color); padding: 0 4px;">${op}</span>`;

      if (screen.textContent === "Inserisci sequenza...") {
        screen.innerHTML = opHtml;
        screen.setAttribute('data-raw', op);
      } else {
        screen.innerHTML += " " + opHtml + " ";
        screen.setAttribute('data-raw', rawVal + op);
      }
    }

    function cancellaDinoInput() {
      const screen = document.getElementById('dino-input-screen');
      screen.textContent = "Inserisci sequenza...";
      screen.setAttribute('data-raw', "");
      document.getElementById('dino-output-screen').textContent = "---";
    }

    function inviaDinoInput() {
      const screen = document.getElementById('dino-input-screen');
      const outputScreen = document.getElementById('dino-output-screen');
      let rawVal = screen.getAttribute('data-raw');
      
      if (!rawVal || rawVal.trim() === "") {
        alert("Inserire una sequenza valida!");
        return;
      }

      // CONTROLLO: Verifica che l'espressione contenga almeno un operatore (+, -, *, /)
      const contieneOperatore = /[+\-*/]/.test(rawVal);
      if (!contieneOperatore) {
        alert("Errore: Non puoi inviare un solo dato! Inserisci almeno un'operazione tra i dinosauri.");
        return;
      }
      
      try {
        // Valuta l'espressione matematica basata sui numeri dei dinosauri
        let risultato = eval(rawVal);
        outputScreen.textContent = risultato;
      } catch (e) {
        outputScreen.textContent = "ERRORE SINTASSI";
      }
    }

    function apriSchedaDino(chiave) {
      const dino = DATABASE_DINOSAURI[chiave];
      const resultContent = document.getElementById('result-content');

      let htmlImmagine = "";
      if (dino.immagine) {
        htmlImmagine = `
          <div class="map-image-container">
            <div class="map-overlay-tag">SPECIE: CLASSIFICATA</div>
            <img src="${dino.immagine}" alt="${dino.nome}" class="map-image">
          </div>
        `;
      }

      resultContent.innerHTML = `
        <p style="color:var(--accent-color); font-weight:bold;">[SCHEDA DINOSAURO]</p>
        <p style="margin-top:8px;">> <strong>Nome:</strong> ${dino.nome}</p>
        <p style="margin-top:4px;">> <strong>Minaccia:</strong> ${dino.pericolo}</p>
        <p style="margin-top:4px;">> <strong>Info:</strong> ${dino.descrizione}</p>
        ${htmlImmagine}
        <button class="dino-btn" style="margin-top:14px; text-align:center;" onclick="mostraHomeDinosauri()">< INDIETRO AL MENU</button>
      `;
    }

    function esciDaDinoMode() {
      document.body.classList.remove('dino-mode');
      document.getElementById('sys-title').textContent = "DB-FEDERALE";
      document.getElementById('sys-subtitle').textContent = "SISTEMA LOCALIZZAZIONE MOBILE";
      document.getElementById('result-title').textContent = "RISULTATO:";
      document.getElementById('search-section').classList.remove('hidden');
      document.getElementById('result-content').innerHTML = "In attesa di input...";
    }

    function avviaEventoHacking() {
      document.body.classList.add('hacked-mode');
      document.getElementById('sys-title').textContent = "INTRUSIONE RILEVATA";
      document.getElementById('sys-subtitle').textContent = "CANALE COMPROMESSO";
      document.getElementById('result-title').textContent = "CANALE SCONOSCIUTO";
      document.getElementById('search-section').classList.add('hidden');

      document.getElementById('result-content').innerHTML = `
        <div class="chat-container">
          <div class="chat-history" id="chat-history"></div>
          <div class="chat-options" id="chat-options"></div>
        </div>
      `;

      inviaMessaggioIA("start");
    }

    function inviaMessaggioIA(nodoChiave) {
      const nodo = IA_atto_1[nodoChiave];
      if (!nodo) return;

      const history = document.getElementById('chat-history');
      const options = document.getElementById('chat-options');

      const testoMessaggioIA = nodo.messaggio.replace(/{SQUADRA}/g, squadraAutenticata.toUpperCase());

      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-msg ia';
      msgDiv.innerHTML = `
        <span class="chat-msg-tag">[IA]:</span>
        <span class="chat-msg-text">${testoMessaggioIA}</span>
      `;
      history.appendChild(msgDiv);
      history.scrollTop = history.scrollHeight;

      options.innerHTML = '';
      if (nodo.opzioni && nodo.opzioni.length > 0) {
        nodo.opzioni.forEach(opt => {
          const testoDinamico = opt.testo.replace(/{SQUADRA}/g, squadraAutenticata.toUpperCase());

          const btn = document.createElement('button');
          btn.className = 'chat-btn';
          btn.textContent = `> ${testoDinamico}`;
          btn.onclick = () => rispondiSquadra(testoDinamico, opt.prossimoNodo);
          options.appendChild(btn);
        });
      } else {
        options.innerHTML = `
          <p style="font-size:0.95rem; color:var(--alert-color); margin-bottom:6px; font-weight:bold;">[INTRUSO RIMOSSO DAL SISTEMA]</p>
          <button class="restore-btn" onclick="ripristinaSistemaEDisplayPosizione()">RIPRISTINA SISTEMA</button>
        `;
      }
    }

    function rispondiSquadra(testoOpzione, prossimoNodo) {
      const history = document.getElementById('chat-history');

      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-msg team';
      msgDiv.innerHTML = `
        <span class="chat-msg-tag">[${squadraAutenticata.toUpperCase()}]:</span>
        <span class="chat-msg-text">${testoOpzione}</span>
      `;
      history.appendChild(msgDiv);
      history.scrollTop = history.scrollHeight;

      document.getElementById('chat-options').innerHTML = `<p style="font-size:0.95rem; font-weight:bold;">Elaborazione...</p>`;

      setTimeout(() => {
        inviaMessaggioIA(prossimoNodo);
      }, 800);
    }

    function ripristinaSistemaEDisplayPosizione() {
      document.body.classList.remove('hacked-mode');
      document.getElementById('sys-title').textContent = "DB-FEDERALE";
      document.getElementById('sys-subtitle').textContent = "SISTEMA LOCALIZZAZIONE MOBILE";
      document.getElementById('result-title').textContent = "RISULTATO:";
      document.getElementById('search-section').classList.remove('hidden');

      const info = DATABASE_COORDINATE[squadraAutenticata][coordinataCorrenteHacking];
      if (info) info.sbloccato = true;

      let htmlImmagine = "";
      if (info && info.immagine) {
        htmlImmagine = `
          <div class="map-image-container">
            <div class="map-overlay-tag">TARGET AGGANCIATO</div>
            <img src="${info.immagine}" alt="Mappa Tattica" class="map-image">
          </div>
        `;
      }

      const luogoFinale = info ? info.luogo : "Sconosciuto";

      document.getElementById('result-content').innerHTML = `
        <p style="color:var(--text-color); font-weight:bold;">[DATO DECRITTATO]</p>
        <p style="margin-top:8px;">> <strong>Codice:</strong> ${coordinataCorrenteHacking}</p>
        <p style="margin-top:4px;">> <strong>Luogo:</strong> ${luogoFinale}</p>
        ${htmlImmagine}
      `;

      coordinataCorrenteHacking = null;
    }

    coordInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') ricercaCoordinata();
    });

    function logout() {
      squadraAutenticata = null;
      coordinataCorrenteHacking = null;
      document.body.classList.remove('hacked-mode');
      document.body.classList.remove('dino-mode');
      document.getElementById('sys-title').textContent = "DB-FEDERALE";
      document.getElementById('sys-subtitle').textContent = "SISTEMA LOCALIZZAZIONE MOBILE";
      document.getElementById('result-title').textContent = "RISULTATO:";
      document.getElementById('search-section').classList.remove('hidden');
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('dashboard-panel').classList.add('hidden');
      document.getElementById('help-panel').classList.add('hidden');
      document.getElementById('login-panel').classList.remove('hidden');
    }
  </script>

</body>
</html>
